name: CI/CD Pipeline & Auto Deploy to Render

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. BACKEND TESTS (WITH MONGODB SERVICE)
  # ==========================================
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci || npm install

      - name: Run Backend Health & Integration Tests
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5001
          MONGO_URI: mongodb://127.0.0.1:27017/quiz_test_ci
          JWT_SECRET: ci_test_super_secret_jwt_key_12345
          MAIL_ENABLED: false
        run: npm test

  # ==========================================
  # 2. FRONTEND TESTS & BUILD VERIFICATION
  # ==========================================
  frontend-tests:
    name: Frontend Test Suite & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: npm run build

  # ==========================================
  # 3. AUTO DEPLOY TO RENDER VIA DEPLOY HOOKS
  # ==========================================
  deploy-render:
    name: Trigger Render Auto-Deploy
    needs: [backend-tests, frontend-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend Service to Render
        env:
          RENDER_BACKEND_DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_BACKEND_DEPLOY_HOOK" ]; then
            echo "⚠️ [WARNING] RENDER_BACKEND_DEPLOY_HOOK secret is not configured in GitHub repository secrets."
            echo "ℹ️ Please add RENDER_BACKEND_DEPLOY_HOOK to your repository Secrets to enable automated backend deployments."
          else
            echo "🚀 Triggering Render backend deployment hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_BACKEND_DEPLOY_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            
            echo "Response: $BODY"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render backend deploy trigger succeeded (HTTP $HTTP_STATUS)!"
            else
              echo "❌ Failed to trigger Render backend deploy. HTTP Status: $HTTP_STATUS"
              exit 1
            fi
          fi

      - name: Deploy Frontend Service to Render (Optional)
        env:
          RENDER_FRONTEND_DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_FRONTEND_DEPLOY_HOOK" ]; then
            echo "ℹ️ [INFO] RENDER_FRONTEND_DEPLOY_HOOK not configured (Skipping frontend deploy hook if hosted elsewhere or bundled)."
          else
            echo "🚀 Triggering Render frontend deployment hook..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_FRONTEND_DEPLOY_HOOK")
            HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
            BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
            
            echo "Response: $BODY"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "✅ Render frontend deploy trigger succeeded (HTTP $HTTP_STATUS)!"
            else
              echo "❌ Failed to trigger Render frontend deploy. HTTP Status: $HTTP_STATUS"
              exit 1
            fi
          fi
